name: Build Windows App (audiodg.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build audiodg.exe for Windows
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NATIVELY_CORE_SMOKE: '1'
      GOOGLE_CALENDAR_CLIENT_SECRET: 'GOCSPX-standalone-build-token'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Compile Native Rust Module (GDI Capture + Stealth)
        run: |
          npm run build:native

      - name: Build TypeScript & Vite Frontend
        run: |
          npm run build
          npm run build:electron

      - name: Package Windows Executable
        run: |
          node scripts/package-app.js --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Finished Executables to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Natively-Windows-audiodg
          path: |
            dist/*.exe
            dist/*.zip
            release/*.exe
            release/*.zip
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-windows
          name: "Latest Windows Build (audiodg.exe)"
          body: |
            Automated Windows Build with GDI Stealth Window Capture Repair.
            Includes `audiodg.exe` disguise and child-window extraction fallback.
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
